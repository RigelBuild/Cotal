name: Nix Linux arm64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/flake-arm64.yml
  push:
    branches: [rigel-release]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/flake-arm64.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Build Cotal for Linux arm64
        run: nix build .#packages.aarch64-linux.cotal --print-build-logs --out-link result
      - name: Check Cotal version
        run: ./result/bin/cotal --version
