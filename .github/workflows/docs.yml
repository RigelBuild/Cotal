name: Docs

# Build the docs site (website/) as a check. This fork has no Cloudflare Pages target, so it
# does not deploy; upstream docs.cotal.ai is deployed from Cotal-AI/Cotal.
# TypeDoc generates the TypeScript reference from published package sources at /api/typescript/.

on:
  push:
    branches: [rigel-release]
    paths:
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'

# A new push to a PR supersedes the build already running for it; rigel-release builds queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: pnpm install --frozen-lockfile
      # The site publishes the TypeScript reference; TypeDoc's warnings stay visible in this log.
      - run: pnpm gen:tsdocs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
