name: Docs

# Build the docs site without publishing from this fork.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'spec/**'
      - 'SPEC.md'
      - 'assets/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'spec/**'
      - 'SPEC.md'
      - 'assets/**'
      - '.github/workflows/docs.yml'

# Supersede PR builds while preserving the pending main build for each commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
