name: Nix

# Evaluates the release flake without building anything. Each package is a fetchurl of a published
# runtime tarball, so a build here would only download; `--no-build` keeps the check to evaluation
# and the fixed-output hash comparison that `nix flake check` performs.

on:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/nix.yml'
  push:
    branches: [rigel-release]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/nix.yml'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Check flake outputs without building
        run: nix flake check --no-build --all-systems
      - name: Evaluate every release package to a derivation
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-darwin; do
            nix eval --raw ".#packages.${system}.cotal.drvPath" >/dev/null
            echo "ok: packages.${system}.cotal evaluates"
          done
